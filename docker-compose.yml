services:
  bot:
    build: .
    image: listen-bot:latest
    container_name: listen-bot
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN required}
      DISCORD_APP_ID: ${DISCORD_APP_ID:?DISCORD_APP_ID required}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DOWNLOAD_HOST_PATH: ${DOWNLOAD_HOST_PATH:?DOWNLOAD_HOST_PATH required}
      DOWNLOADER_IMAGE: ${DOWNLOADER_IMAGE:-listen-downloader:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  downloader:
    build: ./downloader
    image: listen-downloader:latest
    profiles: ["build-only"]
    command: ["--version"]
