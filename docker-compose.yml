services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: listen-docker-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy
    restart: unless-stopped

  bot:
    build: .
    image: listen-bot:latest
    container_name: listen-bot
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN required}
      DISCORD_APP_ID: ${DISCORD_APP_ID:?DISCORD_APP_ID required}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DOWNLOAD_HOST_PATH: ${DOWNLOAD_HOST_PATH:?DOWNLOAD_HOST_PATH required}
      DOWNLOADER_IMAGE: ${DOWNLOADER_IMAGE:-listen-downloader:latest}
      MEDIA_DOWNLOADER_IMAGE: ${MEDIA_DOWNLOADER_IMAGE:-listen-media-downloader:latest}
      BT_STOP_TIMEOUT: ${BT_STOP_TIMEOUT:-}
      BT_TRACKERS: ${BT_TRACKERS:-}
    depends_on:
      - docker-proxy
    networks:
      - proxy
      - default
    restart: unless-stopped

  downloader:
    build: ./downloader
    image: listen-downloader:latest
    profiles: ["build-only"]
    command: ["--version"]

  media-downloader:
    build: ./media-downloader
    image: listen-media-downloader:latest
    profiles: ["build-only"]
    command: ["yt-dlp", "--version"]

networks:
  proxy:
    internal: true
